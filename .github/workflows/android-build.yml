name: Build REIKO Android APK

# 触发条件：
#   1. 推送到 master 或 main 分支时自动构建
#   2. 推送 v* 标签时构建并自动发布 GitHub Release（应用内检查更新即读取最新 Release）
#   3. 也可在 Actions 页面手动触发 (workflow_dispatch)
on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed APK (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      # 签名配置：密钥库 relko-release.keystore 随仓库提交，
      # 这里按构建时生成 android/key.properties（该文件不入库）。
      # JitPack 冷启动失败兜底：等待后重试一次拉依赖。
      - name: Write signing config (key.properties)
        run: |
          cat > android/key.properties <<'EOF'
          storeFile=../relko-release.keystore
          storePassword=relko2026sign
          keyAlias=relko
          keyPassword=relko2026sign
          EOF

      - name: Build APK (release, arm64)
        run: |
          flutter build apk --release || (sleep 90 && flutter build apk --release)

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "REIKO-v${VERSION}.apk"
          echo "APK: REIKO-v${VERSION}.apk ($(du -h "REIKO-v${VERSION}.apk" | cut -f1))"
          echo "apk_name=REIKO-v${VERSION}.apk" >> "$GITHUB_ENV"

      # 方式一：通过工作流产物 (Artifacts) 提供下载（每次构建都会生成）
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REIKO-apk
          path: ${{ env.apk_name }}
          retention-days: 30

      # 方式二：推送 v* 标签时自动创建 GitHub Release 并附上 APK。
      # 应用内「检查更新」读取最新 Release：tag 为版本号，body 为更新说明，
      # body 中包含 [force] 标记时视为强制更新。
      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: REIKO ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.apk_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
