name: Build REIKO Beta APK → Cloudflare R2 (beta 通道)

# beta 分支专用打包流水线。与 android-build.yml 的正式流水线**完全隔离**：
#   - 只在 push 到 beta 分支时触发；
#   - 版本码基数 2000000（正式是 1000000），互不干扰；
#   - 安装包与更新清单写到 R2 的 beta/ 前缀，**不碰**根目录 latest.json；
#   - GitHub Release 标记为 prerelease，tag 前缀 beta-v，不与正式 tag 冲突。
# 这样做是因为 beta 包的 applicationId 与正式包不同（com.reiko.app），
# 若 beta 覆盖了正式 latest.json，正式用户点「检查更新」会拿到一个
# Android 判定为「另一个应用」的安装包，更新必然失败。

on:
  push:
    branches:
      - beta
  workflow_dispatch:
    inputs:
      notes:
        description: '更新说明（留空则使用最近一条提交信息）'
        required: false
        default: ''

# 与正式流水线分开排队，互不取消。
concurrency:
  group: android-beta-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  AWS_ENDPOINT_URL_S3: https://${{ secrets.R2_ACCOUNT_ID }}.us.r2.cloudflarestorage.com
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # 更新清单写到 beta/ 子路径，应用端通过 dart-define 指向这里。
  MANIFEST_PATH: beta/latest.json
  VERSION_CODE_BASE: 2000000
  KEEP_VERSIONS: 2

jobs:
  beta:
    name: Build & Publish Beta (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version & update notes
        env:
          MANUAL_NOTES: ${{ github.event.inputs.notes }}
          COMMIT_NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          BASE_VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1 | cut -d'.' -f1-2)
          VERSION_NAME="${BASE_VERSION}.${GITHUB_RUN_NUMBER}-beta"
          VERSION_CODE=$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER))
          APK_NAME="REIKO-beta-v${GITHUB_RUN_NUMBER}.apk"

          NOTES="$MANUAL_NOTES"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="$COMMIT_NOTES"
          fi
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES=$(git log -1 --pretty=%B)
          fi

          echo "版本号   : $VERSION_NAME"
          echo "版本码   : $VERSION_CODE"
          echo "安装包   : $APK_NAME"

          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "APK_NAME=${APK_NAME}"
            echo "NOTES<<NOTES_DELIM_7Q2"
            echo "${NOTES}"
            echo "NOTES_DELIM_7Q2"
          } >> "$GITHUB_ENV"

          printf '%s\n' "$NOTES" > release_notes.md

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: flutter pub get

      # 与正式流水线共用同一套签名 secrets（同一个 keystore）。
      - name: Write signing config (from GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::缺少 Repository Secret: $v"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::签名 secrets 未配置，终止 beta 构建"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > relko-release.keystore
          chmod 600 relko-release.keystore
          cat > android/key.properties <<EOF
          storeFile=../relko-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK (release, arm64)
        run: |
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --dart-define=KA_MUSIC_UPDATE_MANIFEST_URL="https://dl.suen.us.ci/${MANIFEST_PATH}" \
            || (sleep 90 && flutter build apk --release \
                  --build-name="$VERSION_NAME" \
                  --build-number="$VERSION_CODE" \
                  --dart-define=KA_MUSIC_UPDATE_MANIFEST_URL="https://dl.suen.us.ci/${MANIFEST_PATH}")

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          echo "APK: $APK_NAME ($(du -h "$APK_NAME" | cut -f1))"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REIKO-beta-apk
          path: ${{ env.APK_NAME }}
          retention-days: 7

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-v${{ env.VERSION_NAME }}
          name: REIKO Beta ${{ env.VERSION_NAME }}
          body_path: release_notes.md
          files: ${{ env.APK_NAME }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build update manifest (beta/latest.json)
        run: |
          set -euo pipefail
          FORCE=false
          if echo "$NOTES" | grep -qi '\[force\]'; then
            FORCE=true
          fi
          jq -n \
            --arg platform android \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg updateContent "$NOTES" \
            --arg downloadUrl "https://dl.suen.us.ci/beta/releases/${APK_NAME}" \
            --argjson forceUpdate "$FORCE" \
            --arg releaseDate "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sha256 "$(sha256sum "$APK_NAME" | awk '{print $1}')" \
            '{platform:$platform, versionName:$versionName, versionCode:$versionCode,
              updateContent:$updateContent, downloadUrl:$downloadUrl,
              forceUpdate:$forceUpdate, releaseDate:$releaseDate, sha256:$sha256}' > latest.json
          cat latest.json

      # 只写 beta/ 前缀，绝不覆盖根目录 latest.json（那是正式用户的更新源）。
      - name: Upload APK & manifest to R2 (beta prefix)
        run: |
          set -euo pipefail
          aws s3api put-object \
            --bucket "$R2_BUCKET" \
            --key "beta/releases/${APK_NAME}" \
            --body "$APK_NAME" \
            --content-type "application/vnd.android.package-archive" \
            --cache-control "public, max-age=31536000, immutable" \
            > /dev/null
          aws s3api put-object \
            --bucket "$R2_BUCKET" \
            --key "$MANIFEST_PATH" \
            --body latest.json \
            --content-type "application/json" \
            --cache-control "no-cache" \
            > /dev/null
          echo "已上传: beta/releases/${APK_NAME} 与 ${MANIFEST_PATH}"

      - name: Prune old beta releases (keep latest)
        run: |
          set -euo pipefail
          OLD_KEYS=$(aws s3api list-objects-v2 --bucket "$R2_BUCKET" --prefix "beta/releases/" --output json \
            | jq -r --argjson keep "$KEEP_VERSIONS" \
              '[.Contents[]? | select(.Key | endswith(".apk"))]
               | sort_by(.LastModified) | reverse | .[$keep:][]?.Key')
          if [ -z "$OLD_KEYS" ]; then
            echo "没有需要清理的旧 beta 版本"
            exit 0
          fi
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            aws s3api delete-object --bucket "$R2_BUCKET" --key "$key" >/dev/null
            echo "已删除旧 beta 版本: $key"
          done <<< "$OLD_KEYS"